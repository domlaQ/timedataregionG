<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari</title>
    <style>
        :root { --primary: #059669; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text); }
        .container { max-width: 450px; margin: 0 auto; }
        .header { text-align: center; padding: 20px 0; }
        .header h1 { font-size: 1.5rem; margin: 0; color: var(--primary); font-weight: 800; }
        .card { background: var(--card); border-radius: 24px; padding: 24px; margin-bottom: 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.03); transition: 0.3s; }
        .m-nomi { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 20px; display: block; border-left: 4px solid var(--primary); padding-left: 12px; }
        .vaqt-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
        .vaqt-row:last-child { border-bottom: none; }
        .vaqt-nomi { font-size: 1rem; color: #64748b; font-weight: 500; }
        .soat { font-size: 1.1rem; font-weight: 700; color: var(--primary); background: #ecfdf5; padding: 4px 12px; border-radius: 10px; }
        #status { text-align: center; font-size: 0.75rem; color: #94a3b8; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        /* Animatsiya */
        .card { animation: slideUp 0.5s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header"><h1>Namoz Vaqtlari</h1></div>
        <div id="app"></div>
        <div id="status"></div>
    </div>

    <script>
        const url = "data.json";
        async function yuklash() {
            try {
                const javob = await fetch(url + "?t=" + Date.now());
                const m = await javob.json();
                let html = "";
                m.masjidlar.forEach(masjid => {
                    let vHTML = `<span class="m-nomi">${masjid.nomi}</span>`;
                    for (let v in masjid.vaqtlar) {
                        vHTML += `<div class="vaqt-row"><span class="vaqt-nomi">${v}</span><span class="soat">${masjid.vaqtlar[v]}</span></div>`;
                    }
                    html += `<div class="card">${vHTML}</div>`;
                });
                document.getElementById('app').innerHTML = html;
                document.getElementById('status').innerText = "Yangilandi: " + m.last_update;
            } catch (x) {
                document.getElementById('app').innerHTML = "<p style='color:red; text-align:center'>Yuklashda xato...</p>";
            }
        }
        yuklash();
        setInterval(yuklash, 60000);
    </script>
</body>
</html>
