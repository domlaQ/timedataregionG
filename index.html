<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari</title>
    <style>
        :root { 
            --gold: #e2b07e; 
            --bg: #0a0a0a; 
        }
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg); 
            background-image: radial-gradient(circle at top, #222 0%, #0a0a0a 60%);
            color: var(--gold); 
            margin: 0; 
            padding: 10px; 
            display: flex;
            justify-content: center;
        }
        .container { width: 100%; max-width: 380px; }
        
        .header { 
            text-align: center; 
            padding: 15px 0 10px 0; 
            margin-bottom: 5px;
        }
        .header h1 { font-size: 1.3rem; margin: 0; font-weight: normal; opacity: 0.9; }

        .m-nomi { 
            font-size: 1.1rem; 
            text-align: center; 
            margin-bottom: 15px; 
            display: block;
            opacity: 0.8;
        }

        /* Satrlar orasini yaqinlashtirish */
        .vaqt-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 8px 15px; /* Satr ichidagi masofa kamaytirildi */
            margin-bottom: 2px; /* Satrlar orasidagi masofa minimal qilindi */
        }

        .vaqt-nomi { 
            font-size: 1.5rem; /* Katta harf */
            font-weight: 500; 
        }
        .soat { 
            font-size: 1.7rem; /* Katta son */
            font-weight: bold; 
            letter-spacing: 1px;
        }

        #status { 
            text-align: center; 
            font-size: 0.7rem; 
            color: rgba(226, 176, 126, 0.4); 
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="app"></div>
        <div id="status"></div>
    </div>

    <script>
        const url = "data.json";
        async function yuklash() {
            try {
                const javob = await fetch(url + "?t=" + Date.now());
                const m = await javob.json();
                let html = "";
                m.masjidlar.forEach(masjid => {
                    // Sarlavha: Namoz vaqtlari va sana
                    html += `<div class="header"><h1>Namoz vaqtlari: ${m.last_update.split(' ')[0]}</h1></div>`;
                    html += `<span class="m-nomi">${masjid.nomi}</span>`;
                    
                    for (let v in masjid.vaqtlar) {
                        html += `
                        <div class="vaqt-row">
                            <span class="vaqt-nomi">${v}</span>
                            <span class="soat">${masjid.vaqtlar[v]}</span>
                        </div>`;
                    }
                });
                document.getElementById('app').innerHTML = html;
                document.getElementById('status').innerText = "Yangilandi: " + m.last_update;
            } catch (x) {
                document.getElementById('app').innerHTML = "<p style='text-align:center'>Yuklashda xato...</p>";
            }
        }
        yuklash();
        setInterval(yuklash, 60000);
    </script>
</body>
</html>
