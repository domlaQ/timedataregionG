<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari</title>
    <style>
        body { font-family: sans-serif; background: #f3f4f6; padding: 20px; text-align: center; }
        .card { background: white; border-radius: 12px; padding: 20px; margin: 10px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .m-nomi { color: #059669; font-size: 1.3rem; font-weight: bold; margin-bottom: 15px; display: block; }
        .vaqt { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; }
        .vaqt:last-child { border-bottom: none; }
        #status { font-size: 11px; color: #999; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="app">Yuklanmoqda...</div>
    <div id="status"></div>

    <script>
        // SIZNING ASOSIY YECHIMINGIZ: 
        // Hech qanday uzun linklarsiz, shunchaki fayl nomini yozamiz
        const url = "data.json"; 

        async function yuklash() {
            try {
                // Keshdan o'qimasligi uchun ?t= qo'shamiz
                const javob = await fetch(url + "?t=" + Date.now());
                if (!javob.ok) throw new Error("Fayl topilmadi");
                
                const malumot = await javob.json();
                let natijaHTML = "";

                malumot.masjidlar.forEach(m => {
                    natijaHTML += `<div class="card"><span class="m-nomi">${m.nomi}</span>`;
                    for (let v in m.vaqtlar) {
                        natijaHTML += `<div class="vaqt"><span>${v}</span><b>${m.vaqtlar[v]}</b></div>`;
                    }
                    natijaHTML += `</div>`;
                });

                document.getElementById('app').innerHTML = natijaHTML;
                document.getElementById('status').innerText = "Yangilandi: " + malumot.last_update;
            } catch (xato) {
                document.getElementById('app').innerHTML = `<p style="color:red">Xatolik: ${xato.message}</p>`;
            }
        }

        yuklash();
        setInterval(yuklash, 60000); 
    </script>
</body>
</html>
