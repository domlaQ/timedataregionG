<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namoz Vaqtlari</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .vaqt { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div id="app">Yuklanmoqda...</div>

    <script>
        // SIZNING RAW LINKINGIZ:
        const url = "https://githubusercontent.com";

        async function start() {
            try {
                // Link oxiriga vaqtni qo'shish keshni chetlab o'tishga yordam beradi
                const r = await fetch(url + "?t=" + Date.now());
                if(!r.ok) throw new Error("Fayl topilmadi: " + r.status);
                
                const d = await r.json();
                let html = `<h2>${d.masjidlar[0].nomi}</h2>`;
                
                for(let v in d.masjidlar[0].vaqtlar) {
                    html += `<div class="vaqt"><span>${v}</span><b>${d.masjidlar[0].vaqtlar[v]}</b></div>`;
                }
                
                document.getElementById('app').innerHTML = `<div class="card">${html}</div><p style="text-align:center; font-size:12px; color:gray; margin-top:10px;">Yangilandi: ${d.last_update}</p>`;
            } catch (err) {
                document.getElementById('app').innerHTML = "<b style='color:red'>Xato: </b>" + err.message + "<br><small>JSON fayli yoki linkini tekshiring.</small>";
            }
        }
        start();
    </script>
</body>
</html>
